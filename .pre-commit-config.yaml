repos:
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend tests
        entry: python -m pytest backend/tests -x -q --tb=no
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-type-check
        name: Frontend type check
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        types: [ts]
        pass_filenames: false