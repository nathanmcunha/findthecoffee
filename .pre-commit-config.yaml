repos:
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend tests
        entry: python -m pytest backend/tests -x -q --tb=no
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-lint
        name: Frontend lint
        entry: deno lint frontend/src/
        language: system
        types: [ts]
        pass_filenames: false

      - id: frontend-format
        name: Frontend format check
        entry: deno fmt --check frontend/src/
        language: system
        types: [ts]
        pass_filenames: false

      - id: frontend-type-check
        name: Frontend type check
        entry: deno check frontend/src/*.ts
        language: system
        types: [ts]
        pass_filenames: false